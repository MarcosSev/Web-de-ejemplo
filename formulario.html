<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Formulario</title>
        <link rel="stylesheet" href="css/estilo.css">
    </head>
    <body>
        <header>
            <h1>Formulario</h1>
            <nav>
                <ul><a href="index.html">Inicio</a></ul>
                <ul><a href="horario.html">Horario</a></ul>
                <ul><a href="formulario.html">Formulario</a></ul>
            </nav>
        </header>
        <main>
			<h2>Formulario de contacto</h2>
			<form>
				<fieldset>
					<legend>Datos personales</legend>
                    <p>
					<label for="nombre">Nombre*:</label>
					<input type="text" id="nombre" name="nombre" required maxlength="15"><br>
                    </p>
                    <p>
                    <label for="apellido">Apellidos*:</label>
                    <input type="text" id="apellido" name="apellido" required maxlength="30"><br>
                    </p>
                    <p>
                    <label for="pass">Contraseña*:</label>
                    <input type="password" id="pass" name="pass" required minlength="8" maxlength="20"><br>
                    </p>
                    <p>
                    <label for="email">Correo electrónico*:</label>
                    <input type="email" id="email" name="email" required><br>
                    </p>
                    <label for="fecha">Fecha de nacimiento*:</label>
                    <input type="date" id="fecha" name="fecha"><br>
                    <p>
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" maxlength="9"><br>
                    </p>
                    <p>
                    <label for="sexo">Sexo:</label>
                    <input type="radio" id="hombre" name="sexo" value="hombre">
                    <label for="hombre">Hombre</label>
                    <input type="radio" id="mujer" name="sexo" value="mujer">
                    <label for="mujer">Mujer</label><br>
                    </p>
                    <p>
                    <label for="comentario">Comentario:</label><br>
                    <textarea id="comentario" name="comentario" rows="8" cols="50" maxlength="500"></textarea><br>
                    </p>
                    <legend>Botones</legend>
                    <p><button type="submit">Enviar formulario</button></p>
                    <p><button type="reset">Limpiar formulario</button></p>

				</fieldset>
			</form>
        </main>
    </body>
    <footer>
        <p>CIFP Virgen de Gracia</p>
        <p>Contacto:
            <a href="mailto:marcosclase124@gmail.com">marcosclase12@gmail.com</a>
        </p>
    </footer>
</html>
